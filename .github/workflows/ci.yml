name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Нижняя объявленная граница и свежая версия. Именно прогон на границе
        # ловит регресс: на 1.11 и ниже валидации падают на маунте без явного
        # kv_version, потому что Terraform вычисляет оба операнда ||.
        terraform: ["1.12.0", "latest"]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -recursive -check -diff

      - name: init
        run: terraform init -backend=false -input=false

      - name: validate
        run: terraform validate

      # Главная проверка. terraform validate не типизирует each.value, поэтому
      # обращение к несуществующему полю объекта он пропускает — ловится только
      # на plan, а тесты как раз планируют. Живой Vault не нужен: все прогоны
      # command = plan, провайдер сконфигурирован фиктивным токеном.
      - name: test
        run: terraform test

  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # minimal требует непустые ca_cert/reviewer JWT: его кластер живёт
          # с disable_local_ca_jwt = true, и precondition этого требует.
          - example: minimal
            plan_args: >-
              -var vault_address=http://127.0.0.1:8200
              -var token_reviewer_jwt=dummy
              -var cluster_ca_cert=dummy-pem
          - example: jwt
            plan_args: "-var vault_address=http://127.0.0.1:8200"
          - example: service
            plan_args: "-var vault_address=http://127.0.0.1:8200"
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.0"
          terraform_wrapper: false

      - name: validate ${{ matrix.example }}
        working-directory: examples/${{ matrix.example }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

      # validate не вычисляет validation/precondition — сломанный пример он
      # пропустит (так в 1.7.0 уехал нерабочий AppRole). plan вычисляет всё;
      # живой Vault не нужен, провайдеру хватает фиктивного токена.
      - name: plan ${{ matrix.example }}
        working-directory: examples/${{ matrix.example }}
        env:
          VAULT_TOKEN: dummy
        run: terraform plan -input=false ${{ matrix.plan_args }}
